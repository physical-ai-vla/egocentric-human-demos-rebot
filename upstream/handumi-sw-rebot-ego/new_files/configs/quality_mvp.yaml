# Stricter acceptance thresholds for the reBot ego-bimanual MVP (AprilTag backend).
# Use with: handumi validate <dataset> --quality-config configs/quality_mvp.yaml
#           handumi convert-eef <dataset> --quality-config configs/quality_mvp.yaml
# Targets: tag visibility > 99 %, camera drop < 1 %, sync skew < 10 ms, motor loss < 1 %,
# no catastrophic pose jumps (5 m/s translation or 90 deg/frame is already a jump).
quality:
  min_duration_s: 1.0
  max_bad_tracking_fraction: 0.01     # tag visibility >= 99 %
  max_bad_sensor_fraction: 0.01       # camera / Feetech health
  max_bad_sync_fraction: 0.01
  max_sync_error_ms: 10.0             # MVP goal (upstream default 60 ms)
  max_translation_speed_m_s: 3.0
  max_rotation_step_deg: 45.0
  max_pose_freeze_s: 1.0
  max_signal_freeze_s: 0.5
  freeze_translation_epsilon_m: 0.00001
  freeze_rotation_epsilon_deg: 0.02
  aperture_range_epsilon_mm: 0.05
  reject_single_side_pose_freeze: false
  reject_aperture_freeze: false
