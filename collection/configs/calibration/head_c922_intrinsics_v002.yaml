notes: 'PROVISIONAL. Use it, but know what it is.

  Focus is LOCKED (auto-focus off, focus-abs 20). Autofocus previously made this a
  different lens every session: three earlier batches each fitted themselves to rms
  0.19-0.26 while disagreeing on fx by 27 percent (417 / 531 / 501), and pooled they
  reached rms 1.06. Any intrinsics taken before the lock are void.

  Steep views EXCLUDED. Focal length is separated from board distance by how foreshortening
  changes between poses, so views at 40-54 degrees were shot deliberately -- but at
  640x480 a 23 mm ChArUco marker cannot be localised that obliquely: those six views
  reach rms 3.91 among THEMSELVES, so the correspondences are wrong, not the model.
  Including them drove cy to -36 px, outside the image.

  What supports this number: fx and cy here agree with the very first 25-view batch
  (fx 417.2, cy 315.3) taken in a different session under different focus. That is
  the only estimate reproduced independently.

  What is still weak: tilt spans only 1.5-22.7 degrees after the exclusion, which
  is why the subset spread below is what it is. Revisit with a LARGER board or a plain
  checkerboard (no markers to lose at an angle) if the pilot shows geometry error
  that matters.'
superseded_reason: 'Free 9-parameter fit on 9 views. Lowest reprojection error of
  any model tried (0.7177) and a 47 percent metric scale error: its K puts the head
  camera 32.0 cm above the table where a tape measure says 47. Superseded by head_c922_intrinsics_v003,
  which constrains the model to what a webcam physically is and lands at 50.6 cm.'
