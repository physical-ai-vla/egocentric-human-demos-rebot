notes: 'PROVISIONAL, and chosen on a PHYSICAL check rather than on reprojection error.

  v002 fitted all nine parameters freely and reached rms 0.7177 -- the lowest of any
  model tried -- and its K put the head camera 32.0 cm above the table when a tape
  measure says 47. Camera distance scales linearly with focal length, so that is a
  47 percent scale error, and every metric quantity downstream would have carried
  it: table coordinates, cube pose from known size, wrist 6 DoF, the retargeted reBot
  EE, IK reach.

  Nine views cannot support nine parameters. Constraining the model to what a webcam
  physically is -- square pixels, principal point at the image centre, no tangential
  term, no k3 -- costs almost nothing in residual (0.7177 -> 0.8237) and moves the
  solved height from 32.0 cm to 50.6 cm against the measured 47.

  Still +7.7 percent out, so this remains provisional: the tape measure is one reading
  and carries its own error, and the tilt range here is only 1.5-22.7 degrees because
  ChArUco corners cannot be localised more obliquely at 640x480. Re-run head_mount_c922
  with this file and check the height again.'
