notes: 'Same measurement as v001/v002, third and final frame convention. Use this
  one; the earlier two have wrong geometry blocks. v001 put the table frame''s Z into
  the table, so the camera read as height -48.3 cm at pitch -62.5 deg -- under the
  table looking up. v002 fixed that and reported roll 4.5 deg from the image x axis
  tipping out of the table plane, which is a projection that shrinks with pitch. Roll
  is now rotation about the optical axis, -9.7 deg. Ray-casting image rows onto the
  table settled the direction: the top of the frame lands 54.8 cm from the camera''s
  footprint and the bottom 6.2 cm, so the camera is upright and the 170 deg an intermediate
  formula produced was the formula, not the rig. The transform and the solve behind
  it never changed: 0.36 px reprojection, depth plane agreeing with the board to 0.46
  deg over 17346 points.'
