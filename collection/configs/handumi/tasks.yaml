cube_set: RBP
colors: {R: red, B: blue, P: purple}
orders: [RBP, RPB, BRP, BPR, PRB, PBR]
target_per_order: 20            # H120 = 6 x 20
instruction_template: "Stack the {bottom} cube on the bottom, {middle} cube in the middle, and {top} cube on the top, on the plate."
# dataset modes: session prefix + per-order target (UI selector). Default = collector.yaml session_prefix / target_per_order above.
datasets:
  Vpilot_vision_only: {target_per_order: 1, note: "IMU-less V0 observability pilot; NEVER counted as H120"}
  Hpilot: {target_per_order: 50, note: "300-episode collection (6 orders x 50), AUTO loop; 2026-09-16 -- was 3 for the pre-pilot"}
  # 2026-10-12 user: laundry folding with both HandUMI units + Orbbec head RGB-D (hardware_handumi_rgbd). One fixed prompt,
  # no cube orders/buttons/colour cues (single-task UI); order label unused. 120 s take, 10 s rest, SPACE/N ends a take early.
  # AUTO voice kept short: "에피소드 N" at the reset, "준비하세요", countdown, "고", "스톱", "저장 완료" (no task announcement).
  Hfold: {target_per_order: 100, orders: [RBP], instruction: "fold the cloth", instruction_voice: "fold the cloth",
          auto_loop: {episode_s: 120.0, reset_s: 10.0, announce_task: false, cue_reset: ""},
          note: "laundry folding (T-shirt), both hands; prompt = Soft-Fold's 'fold the cloth'"}
  # 2026-10-12 UMI-only spec (T-shirt folding -> X-VLA): UMIpilot = the 5-episode go/no-go pilot, UMI100 = main collection
  # (only after the pilot passes). Start protocol: both TCPs on the green X_L / X_R markers, jaws per the arrow, still 2-3 s
  # -- that hold is INSIDE the recording (REC -> 3 s hold countdown -> GO) and is the world-alignment window.
  # Metadata (garment_id, initial_state, outcome, notes) from the UI panel -> episode_meta.umi_tags. IMU recorded, not used.
  UMIpilot: {target_per_order: 5, orders: [RBP], instruction: "Fold the T-shirt.", instruction_voice: "Fold the T-shirt.",
             auto_loop: {episode_s: 120.0, reset_s: 10.0, announce_task: false, cue_reset: "", cue_ready: "마커에 두세요"},
             world_config: world_config_umi_v1.json, note: "UMI-only go/no-go pilot (5 eps, bright textured T-shirt)"}
  UMI100:   {target_per_order: 100, orders: [RBP], instruction: "Fold the T-shirt.", instruction_voice: "Fold the T-shirt.",
             auto_loop: {episode_s: 120.0, reset_s: 10.0, announce_task: false, cue_reset: "", cue_ready: "마커에 두세요"},
             world_config: world_config_umi_v1.json, note: "UMI-only main collection, 70 normal + 30 moderate variations"}
  # 2026-10-13 user: Stage 1 of the folding task on its own -- one long-ish episode "Flatten and align the T-shirt."
  # (pick a semi-flat / sleeve-folded / rotated / slightly crumpled shirt, flatten it, align collar/body axis; ends in the
  # canonical state the fold stage starts from). 30 s take. Not split into primitives.
  UMIalign: {target_per_order: 100, orders: [RBP], instruction: "Flatten and align the T-shirt.", instruction_voice: "Flatten and align the T-shirt.",
             auto_loop: {episode_s: 60.0, reset_s: 10.0, announce_task: false, cue_reset: "", cue_ready: "마커에 두세요"},
             world_config: world_config_umi_v1.json, note: "UMI Stage 1 unfold/align, 60 s, start states varied (see umi_tags.initial_state)"}
  H120:   {target_per_order: 20, note: "final; only after IMU + VIO/TCP validation"}
  # 2026-09-28 robot-like ego (protocol robot_like_v1, run with --protocol robot_like_v1): first goal ~80 on top of the
  # 259 C8 episodes, compared as `old ego only` vs `old + robot-like ego`. Own dataset dir so it can never mix with Hpilot.
  HRL80:  {target_per_order: 14, note: "robot_like_v1 first batch, 6 orders x 14 = 84; +50-100 later if it helps"}
  # 2026-10-03 single-prompt approach take (right hand only, hardware_handumi_v1_right.yaml). One fixed instruction;
  # the order label is unused (one order so AUTO never rotates it).
  HRA_red: {target_per_order: 100, orders: [RBP], instruction: "Approach to the red cube",
            instruction_voice: "빨간 큐브로 접근하세요",          # spoken in AUTO at each reset instead of the order colours
            auto_loop: {episode_s: 10.0, reset_s: 5.0},           # user 2026-10-03: AUTO 10 s episode; reset 10 s -> 5 s (same day)
            # user 2026-10-03: approach-only -> no grasp, so the jaw-travel REJECT and the robot-like grasp/rot/rot-acc
            # FAIL were failing every take; then a jaw at rest read one tick for a whole take (frozen). All three off for this
            # mode (still shown + logged); too few jaw samples / out-of-span still REJECT.
            qa: {gripper_checks: false, robot_like: advisory},   # user: "이런거 꺼줘" -- no jaw checks at all for this mode
            note: "single prompt 'Approach to the red cube'; order label unused"}
  # 2026-10-06 user: NEW-EGO-A, 100 approach takes starting from the robot-A-matched view (right hand only, hardware_handumi_v1_right).
  # Cycle: rest 5 s ("다음 시작 위치로 가세요") -> hand still 2 s at the start pose -> REC + 2 s still hold ("2, 1") -> GO -> 10 s.
  # The record tab shows a ROBOT C922 VIEW tile (live fisheye -> measured robot camera, robot pose-A frame overlaid) to match the start.
  HRA_A100: {target_per_order: 100, orders: [RBP], instruction: "Approach to the red cube",
             instruction_voice: "영 영 영 위치로 가세요",                # user 2026-10-06: taped origin pose first
             # REC starts after 2 s still at the taped 0,0,0 pose, "2, 1" origin hold inside the recording, "준비" -> 3 s to reach the
             # robot-like start pose, "시작" -> 10 s approach. Events: go_cue (origin hold end), prep_start, go (training starts here).
             auto_loop: {episode_s: 10.0, reset_s: 5.0, min_still_s: 2.0, hold_after_rec_s: 2.0, prep_s: 3.0, cue_prep: "준비", cue_go: "시작"},
             qa: {gripper_checks: false, robot_like: advisory},
             record_c922_view: true,                               # user 2026-10-06: raw fisheye + right_wrist_c922.mp4 together
             note: "robot-A start view (cam ~28 cm above table, ~59 deg down); cube layout 40 centre / 20 L-R / 20 F-B / 20 edge"}
  # 2026-09-18 RGB-D teacher-sensor pilot: depth is recorded to LABEL human metric xyz/EEF, never as policy
  # input. Ten episodes, then QA -- no 100-episode collection until the QA report is read.
  HRGBD_qa10: {target_per_order: 2, orders: [RBP, RPB, BRP, BPR, PRB],
               note: "10 = 5 orders x 2; QA gate before any larger RGB-D take"}
  # 2026-09-18 body->TCP + orientation calibration. NOT a stacking take: the order label is unused and the operator
  # follows the motion protocol in docs/handumi_collector/RGBD_TEACHER_QA.md (static, xyz, roll/pitch/yaw,
  # rotation+translation, near/far workspace, grip open/close). Two episodes = one per hand, 20-30 s each.
  CALIB_bodytcp: {target_per_order: 2, orders: [RBP],
                  note: "body->TCP full SE(3) + IMU orientation calibration; 2 episodes, motion protocol not stacking"}
