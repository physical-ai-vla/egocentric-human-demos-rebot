# PRODUCTION (pre-IMU) — HandUMI raw collection with the hardware available today:
#   head Orbbec RGB-D (policy obs RGB + raw depth) + LEFT/RIGHT Arducam fisheye (pose tracking, raw only) + LEFT/RIGHT Feetech jaw encoder.
# ICM42688P IMUs are NOT installed yet: `imus: []` => UI shows "IMU not installed" (grey), recording is not blocked, and the
# /left/imu /right/imu MCAP channels stay reserved. When the IMUs arrive switch to hardware_handumi_v1.yaml (IMUs required).
hardware_version: handumi_v1_preimu
profile: handumi_preimu
calibration_version: uncalibrated
cameras:
  # HEAD = Orbbec RGB-D (2026-09-11): the C922 is retired. Human head and reBot head now use the SAME modality,
  # which is the point - it removes the head observation domain gap. `role: aux_depth` is what makes recorder.py
  # write the depth PNGs, so the role and the `head_depth` stream name must NOT be renamed to policy_obs/head.
  # RGB is the V1 policy input; depth is always stored raw and enters the policy only in a later ablation.
  - {name: left_wrist, role: pose_estimation, backend: uvc, match_name: "Arducam", ordinal: 0, width: 1920, height: 1080, fps: 30, fourcc: MJPG, required: true}
  - {name: right_wrist, role: pose_estimation, backend: uvc, match_name: "Arducam", ordinal: 1, width: 1920, height: 1080, fps: 30, fourcc: MJPG, required: true}
  - {name: head_depth, role: aux_depth, backend: orbbec, width: 848, height: 480, fps: 30, required: true}
imus: []                                   # pending hardware — optional by absence
grippers:
  # LEFT/RIGHT Arducam = AVFoundation ordinal 0/1 — verify in the UI preview (cover one lens) and swap the ordinals if needed.
# Identity = USB serial number of each unit's bus adapter (`port_serial`, wins over `port`). Find them with
  #   python -m handumi_collector.tools.gripper_monitor --scan      (2026-09-10: unit with CH343 adapter 5B3D048082 answers as servo id 1)
  - {side: left,  backend: feetech, port_serial: "5B3D048082", port: "/dev/cu.usbmodem5B3D0480821", servo_id: 1, baud: 1000000, sample_hz: 100, norm_one_is: open, required: true}
  - {side: right, backend: feetech, port_serial: "5B3D049747", port: "/dev/cu.usbmodem5B3D0497471", servo_id: 1, baud: 1000000, sample_hz: 100, norm_one_is: open, required: true}   # right unit adapter (2026-09-10); servo id assumed 1 — confirm with --scan once powered
gripper_calibration: latest
