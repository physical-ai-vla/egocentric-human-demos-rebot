body_frame:
  convention: origin at a repeatable CAD datum on the rigid body; +x = gripper forward
    (approach), +y = gripper left, +z = gripper up — the SAME axes as the TCP frame,
    so body->TCP is a pure offset
  datum: 'FILL IN: name the CAD feature the origin sits on (e.g. ''centre of the controller-support
    ring face'')'
  note: the tracker reports T_depthcam_body in THIS frame; configs/calibration/handumi_body_tcp_<side>_vNNN.yaml
    then carries body->TCP (Stage B / M2C)
how_to_fill:
- 'Preferred: export ONE assembled rigid body from CAD in the body frame and skip
  this file entirely -'
- '  point depth_pose.yaml `mesh.<side>` straight at that .obj/.stl.'
- 'Otherwise: for each included part set pose.translation_m and pose.quaternion_xyzw
  = the part''s pose in B.'
- Never include a moving part; never scale a part to make an assembly 'fit'.
